<style>/* Layout: dark forest sidebar | white top bar (page name + Report month) over a warm grey canvas with a large page intro and white cards.
   One deliberate light look; every colour is a token set explicitly so it reads the same on any host. */
:root {
  --forest: #1f3a33; --forest-2: #29473f; --forest-ink: #e9efe9; --forest-muted: #9fb5aa; --forest-line: rgba(255, 255, 255, .12);
  --cream: #f7f2e8; --gold: #d4a865; --gold-deep: #8a6420; --gold-soft: #f6ead2;
  --bg: #f3f4f0; --surface: #ffffff; --surface-2: #f6f7f4; --tint: #e7efea;
  --ink: #1c2a25; --heading: #1f3a33; --muted: #627169; --line: #e2e7e1; --line-strong: #d0d8d0;
  --accent: #2f6656; --accent-hover: #24524a; --accent-ink: #ffffff; --accent-soft: #e4eeea;
  --good: #1f6a3c; --good-soft: #e3f1e7; --bad: #a83a22; --bad-soft: #fbe9e3; --warn: #8a5a00; --warn-soft: #fbf1d8;
  --bar: #3d7a66; --bar-track: #e6ebe6;
  --font: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px; --radius-sm: 11px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { color: var(--heading); line-height: 1.15; text-wrap: balance; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
h1 { font-size: 2.5rem; }
h2 { font-size: 1.35rem; letter-spacing: -0.01em; }
h3 { font-size: 1.05rem; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
.num, td.r, .stat-value, .kpi-value { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.visually-hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--gold); color: var(--forest); padding: 8px 12px; border-radius: 8px; z-index: 50; font-weight: 700; }
.skip:focus { top: 8px; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Shell ---------- */
#app { display: grid; grid-template-columns: var(--side-w, 280px) minmax(0, 1fr); min-height: 100vh; }
.sidebar { background: var(--forest); color: var(--forest-ink); padding: 32px 22px 24px; padding-left: max(22px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 34px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 14px; padding: 0 6px; }
.brand-tile { width: 46px; height: 46px; border-radius: 13px; background: var(--gold); color: var(--forest); display: grid; place-items: center; font-weight: 700; font-size: 1rem; flex: none; }
.brand strong { display: block; font-size: 1.15rem; font-weight: 700; color: #fff; line-height: 1.2; letter-spacing: -0.01em; }
.brand-sub { display: block; font-size: .88rem; color: var(--forest-muted); }
.brand.on-light strong { color: var(--heading); } .brand.on-light .brand-sub { color: var(--muted); }
.sidebar ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sidebar nav a { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; color: var(--forest-ink); text-decoration: none; font-weight: 500; font-size: 1.02rem; }
.sidebar nav a:hover { background: var(--forest-2); }
.sidebar nav a[aria-current="page"] { background: var(--cream); color: var(--forest); font-weight: 700; }
.nav-ico { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.side-foot { margin-top: auto; border-top: 1px solid var(--forest-line); padding: 18px 6px 0; display: flex; gap: 10px; color: var(--forest-muted); font-size: .86rem; line-height: 1.45; }
.side-foot .ico { width: 18px; height: 18px; margin-top: 1px; }
.save-status { display: flex; gap: 7px; align-items: center; margin-top: 6px; font-size: .78rem; }
.save-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.save-status.good { color: #9fd3b0; } .save-status.bad { color: #f2b3a2; } .save-status.muted { color: var(--forest-muted); }
.content { display: flex; flex-direction: column; min-width: 0; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 22px; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.topbar-title { font-size: 1.75rem; font-weight: 700; color: var(--heading); letter-spacing: -0.02em; line-height: 1.2; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; color: var(--muted); }
.month-picker { display: flex; align-items: center; gap: 14px; }
.mp-label { color: var(--muted); font-weight: 600; }
.month-box { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 12px; padding: 6px 14px 6px 8px; background: var(--surface); }
.month-box select { font: inherit; font-weight: 600; color: var(--ink); border: 0; background: transparent; padding: 6px 4px; border-radius: 8px; cursor: pointer; appearance: none; -webkit-appearance: none; }
.month-box .ico { margin-left: 8px; color: var(--ink); }
main { padding-block: 44px 72px; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); max-width: 1320px; width: 100%; display: grid; gap: 22px; align-content: start; min-width: 0; }
main:focus { outline: none; }

/* The navigation always sits on the left:
   wide = full sidebar, medium = slimmer sidebar, narrow = icon rail, phone = slide-in side drawer. */
.menu-btn, .nav-scrim { display: none; }
#app { --side-w: 280px; }
@media (max-width: 1200px) {
  #app { --side-w: 232px; grid-template-columns: var(--side-w) minmax(0, 1fr); }
  .sidebar { padding: 26px 14px 20px; gap: 28px; }
  .sidebar nav a { padding: 11px 13px; gap: 12px; font-size: .98rem; }
  .topbar, main { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 900px) {
  #app { --side-w: 76px; }
  .sidebar { padding: 20px 10px; gap: 22px; align-items: center; }
  .brand { padding: 0; }
  .brand > span:last-child { display: none; }
  .sidebar nav { width: 100%; }
  .sidebar nav a { justify-content: center; padding: 12px 0; position: relative; }
  .sidebar nav a .nav-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sidebar nav a:hover .nav-label, .sidebar nav a:focus-visible .nav-label { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); width: auto; height: auto; clip: auto; overflow: visible; background: var(--forest); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: .85rem; z-index: 40; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
  .side-foot { justify-content: center; padding: 14px 0 0; }
  .side-foot > div { display: none; }
  .topbar-title { font-size: 1.4rem; }
  .mp-label { display: none; }
  main { padding-block: 28px 56px; gap: 18px; }
  h1 { font-size: 2rem; }
}
@media (max-width: 600px) {
  #app { grid-template-columns: minmax(0, 1fr); background: var(--bg) !important; }
  .menu-btn { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--heading); cursor: pointer; flex: none; }
  .topbar { flex-wrap: nowrap; gap: 12px; padding-block: 12px; position: static; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar > div:nth-child(2) { margin-right: auto; min-width: 0; }
  .topbar .eyebrow { display: none; }
  .topbar-title { font-size: 1.2rem; }
  .month-box { padding: 4px 8px 4px 4px; }
  .month-box .ico { display: none; }
  .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 70; width: min(290px, 84vw); height: 100dvh; align-items: stretch; padding: calc(22px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.25); visibility: hidden; }
  #app.nav-open .sidebar { transform: none; visibility: visible; }
  .brand > span:last-child { display: block; }
  .sidebar nav a { justify-content: flex-start; padding: 12px 14px; }
  .sidebar nav a .nav-label, .sidebar nav a:hover .nav-label, .sidebar nav a:focus-visible .nav-label { position: static; width: auto; height: auto; clip: auto; overflow: visible; background: none; padding: 0; box-shadow: none; transform: none; color: inherit; font-size: inherit; }
  .side-foot { justify-content: flex-start; }
  .side-foot > div { display: block; }
  #app.nav-open .nav-scrim { display: block; position: fixed; inset: 0; z-index: 65; background: rgba(31, 58, 51, .45); border: 0; padding: 0; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 52px; gap: 16px; }
  h1 { font-size: 1.75rem; }
}

/* ---------- Page intro ---------- */
.hero { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; justify-content: space-between; padding-bottom: 6px; }
.hero-text { display: grid; gap: 10px; max-width: 72ch; min-width: 0; }
.hero h1:focus { outline: none; }
.lede { color: var(--muted); font-size: 1.06rem; }
.page-actions, .sub-actions, .card-actions, .btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sub-actions { justify-content: space-between; }
.sub-actions > .tiny { flex: 1 1 260px; }

/* ---------- Cards & stats ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 28px; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; }
.card.flush { padding: 0; gap: 0; overflow: hidden; }
.pad { padding: 18px 24px; }
.card-head { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 6px 14px; }
.card-head > :first-child { margin-right: auto; }
.card-head > div { display: grid; gap: 4px; }
.card-head .tiny { flex-basis: 100%; }
.card-intro { display: grid; gap: 6px; }
.card-intro p { color: var(--muted); }
.card-intro.with-action { grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 12px; }
.card-intro.with-action > div { display: grid; gap: 6px; }
.count { font-size: .85rem; font-weight: 700; color: var(--muted); text-align: right; }
.legend { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bar); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1180px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .stats, .stats.three { grid-template-columns: minmax(0, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; display: grid; gap: 10px; align-content: start; min-width: 0; min-height: 150px; }
.stats > .stat:first-child { background: var(--tint); border-color: #d6e3dc; }
.stat-label { font-weight: 600; color: #3f4f48; display: flex; align-items: center; gap: 6px; }
.stat-value { font-size: 2rem; font-weight: 700; color: var(--heading); letter-spacing: -0.02em; overflow-wrap: anywhere; line-height: 1.1; }
.stat-empty { font-size: 1.25rem; font-weight: 600; color: var(--muted); }
.stat-foot { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: .9rem; }
.stat-note { font-size: .86rem; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 6px; min-width: 0; }
.kpi-label { font-weight: 600; color: #3f4f48; }
.kpi-value { font-size: 1.5rem; font-weight: 700; color: var(--heading); }
.kpi-extra { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.muted-val { color: var(--muted); font-size: 1.05rem; font-weight: 600; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 22px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px; }
@media (max-width: 1000px) { .grid-main, .grid-2 { grid-template-columns: minmax(0, 1fr); } }
.stack-gap { display: grid; gap: 20px; }
.tiny { font-size: .82rem; color: var(--muted); }
.block { display: block; }
.dim { color: var(--muted); }
.small-pad { padding: 4px 0 8px; }
.note { font-size: .88rem; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; }
.nowrap { white-space: nowrap; }
.neg { color: var(--bad); }
.in { color: var(--good); }
.warn-text { color: var(--bad); font-size: .9rem; }
.strong { font-weight: 700; }
.footnote { text-align: center; font-size: .84rem; color: var(--muted); }

/* ---------- Info tooltip ---------- */
.info { position: relative; display: inline-grid; place-items: center; color: var(--muted); cursor: help; border-radius: 50%; }
.info .ico { width: 16px; height: 16px; }
.info-pop { position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); width: max-content; max-width: 240px; background: var(--forest); color: #fff; font-size: .8rem; font-weight: 500; line-height: 1.4; padding: 8px 10px; border-radius: 9px; z-index: 20; opacity: 0; visibility: hidden; transition: opacity .12s; box-shadow: 0 8px 22px rgba(0,0,0,.18); }
.info:hover .info-pop, .info:focus .info-pop { opacity: 1; visibility: visible; }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.muted { background: var(--surface-2); color: var(--muted); }
.pill { display: inline-block; font-size: .74rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.gold { background: var(--gold-soft); color: var(--gold-deep); }
.pill.outline { background: transparent; border: 1px solid var(--line-strong); color: var(--muted); }
.pill.t-income, .pill.b-revenue { background: var(--good-soft); color: var(--good); }
.pill.t-card_payment, .pill.b-tax_payment, .pill.b-tax_collected, .pill.b-tax_paid { background: var(--gold-soft); color: var(--gold-deep); }

/* ---------- Rows / bars ---------- */
dl.rows { margin: 0; display: grid; }
dl.rows > div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
dl.rows > div:last-child { border-bottom: 0; }
dl.rows dt { color: var(--muted); min-width: 0; }
dl.rows dd { margin: 0 0 0 auto; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
dl.rows > div.total dt { color: var(--heading); font-weight: 700; }
dl.rows.big dd { font-size: 1.04rem; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.bar-label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.bar-label span:first-child { min-width: 0; overflow-wrap: anywhere; }
.bar-track, .progress { height: 8px; background: var(--bar-track); border-radius: 4px; overflow: hidden; }
.bar-track span, .progress span { display: block; height: 100%; background: var(--bar); border-radius: 4px; }
.goals-table .progress { margin-top: 8px; max-width: 200px; }
.goal-mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.empty { text-align: center; padding: 34px 12px; display: grid; gap: 8px; justify-items: center; color: var(--muted); }
.empty-ico { width: 60px; height: 60px; border-radius: 16px; background: var(--tint); color: var(--accent); display: grid; place-items: center; margin-bottom: 8px; }
.empty-ico .ico { width: 26px; height: 26px; }
.empty-title { font-weight: 700; color: var(--heading); font-size: 1.2rem; letter-spacing: -0.01em; }
.empty p:not(.empty-title) { max-width: 46ch; }
.alert { border-radius: var(--radius-sm); padding: 12px 16px; border: 1px solid transparent; }
.alert.warn { background: var(--warn-soft); border-color: #eedcae; color: var(--ink); }
.alert.bad { background: var(--bad-soft); border-color: #f0c9bc; color: var(--ink); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: .93rem; }
th, td { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; background: var(--surface); white-space: nowrap; }
.card.flush thead th { background: var(--surface-2); }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
tbody th { font-weight: 600; }
tfoot th, tfoot td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--line); background: var(--surface-2); }
.r { text-align: right; }
td.r, th.r { white-space: nowrap; }
table.compact th, table.compact td { padding: 10px 12px; }
.card:not(.flush) table th:first-child, .card:not(.flush) table td:first-child { padding-left: 0; }
.card:not(.flush) table th:last-child, .card:not(.flush) table td:last-child { padding-right: 0; }
tr.current th, tr.current td { background: var(--gold-soft); }
tr.flagged th, tr.flagged td { background: var(--warn-soft); }
tr.archived th, tr.archived td { color: var(--muted); }
tr.total th, tr.total td { font-weight: 700; }
td.actions { white-space: nowrap; text-align: right; }
.grid-table td, .grid-table th { padding: 8px 9px; font-size: .85rem; }
.row-title { font: inherit; font-weight: 700; color: var(--heading); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.row-title:hover { text-decoration: underline; }
.warn-link { color: var(--bad) !important; font-weight: 700; }
@media (max-width: 720px) {
  table.stack thead { display: none; }
  table.stack, table.stack tbody, table.stack tr, table.stack th, table.stack td { display: block; width: 100%; }
  table.stack tr { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  table.stack th, table.stack td { border: 0; padding: 2px 0; text-align: left; white-space: normal; }
  table.stack td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: .82rem; }
  table.stack th[scope="row"] { font-size: 1rem; }
  table.stack td.actions { text-align: left; padding-top: 6px; }
}

/* ---------- Buttons ---------- */
.btn { font: inherit; font-weight: 700; font-size: .95rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--heading); cursor: pointer; text-decoration: none; min-height: 44px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 12px rgba(47, 102, 86, .18); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-soft { background: var(--bad-soft); border-color: #efc5b8; color: var(--bad); }
.btn.danger-soft:hover { background: #f7dcd3; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { font-size: .85rem; padding: 5px 12px; min-height: 34px; }
.btn.big { padding: 12px 24px; font-size: 1rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn .ico { width: 18px; height: 18px; }
.danger-text { color: var(--bad) !important; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.small-link { font-size: .9rem; font-weight: 600; }
.text-btn { font: inherit; font-weight: 700; color: var(--muted); background: none; border: 0; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.text-btn:hover { color: var(--heading); background: var(--surface-2); }
.icon-btn { font: inherit; font-size: 1.5rem; line-height: 1; background: none; border: 0; color: var(--muted); cursor: pointer; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--heading); }

/* ---------- Forms ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; }
@media (max-width: 560px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.full { grid-column: 1 / -1; }
.field { display: grid; gap: 7px; align-content: start; min-width: 0; }
.field > label, .field .label { font-weight: 700; font-size: .9rem; color: var(--heading); text-transform: none; letter-spacing: 0; }
.field input, .field select, .field textarea, .filters input, .filters select, .inline-select select, .freq-select {
  font: inherit; font-size: .97rem; width: 100%; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); min-height: 48px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field [aria-invalid="true"], .freq-select.needs { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.affix { display: flex; align-items: center; position: relative; }
.affix > span { position: absolute; left: 14px; color: var(--muted); font-weight: 600; pointer-events: none; }
.affix input { padding-left: 30px; }
.hint { font-size: .84rem; color: var(--muted); }
.error { font-size: .85rem; color: var(--bad); font-weight: 700; }
.error::before { content: "⚠ "; }
.error-banner { background: var(--bad-soft); color: var(--bad); border-radius: var(--radius-sm); padding: 12px 14px; font-weight: 600; }
.error-banner ul { margin: 6px 0 0; padding-left: 18px; }
.req { color: var(--bad); }
.static { padding: 12px 0; }
.check-row { display: flex; gap: 10px; align-items: center; padding: 4px 0; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
.check-row input, .field.check input { width: 20px; height: 20px; }
.field.check label { display: flex; gap: 10px; align-items: center; font-weight: 700; color: var(--heading); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 700; font-size: .92rem; padding: 0; margin-bottom: 6px; color: var(--heading); }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 14px; align-items: end; }
.filters .field label { font-size: .82rem; }
.filter-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.totals-strip { display: flex; flex-wrap: wrap; gap: 10px 26px; padding: 2px 4px; }
.totals-strip > span { display: flex; gap: 8px; align-items: baseline; }
.label { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.inline-select { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
.inline-select select { min-height: 38px; padding: 5px 10px; width: auto; }
.report-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.freq-select { min-height: 38px; padding: 5px 10px; font-size: .9rem; max-width: 170px; }

/* Segmented controls (period switch, allocation, category filter) */
.seg, .segmented { display: inline-flex; background: #eef1ec; border-radius: 12px; padding: 4px; gap: 4px; }
.seg-btn, .segmented label span, .seg-item { font: inherit; font-weight: 700; font-size: .9rem; border: 0; background: transparent; color: var(--muted); padding: 9px 16px; border-radius: 9px; cursor: pointer; display: block; text-align: center; }
.seg-btn[aria-pressed="true"], .seg-item[aria-pressed="true"], .segmented input:checked + span { background: var(--surface); color: var(--heading); box-shadow: 0 1px 3px rgba(31, 58, 51, .12); }
.segmented label { flex: 1; position: relative; }
.segmented input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.segmented input:focus-visible + span { outline: 3px solid var(--gold); }
fieldset.segmented { display: flex; }
.segmented.small .seg-item { padding: 6px 12px; font-size: .85rem; }

.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line-strong); overflow-x: auto; }
.tab { font: inherit; font-weight: 700; border: 0; background: transparent; padding: 12px 16px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--heading); border-bottom-color: var(--accent); }
.more { padding: 12px 16px; text-align: center; }

/* ---------- Plan ---------- */
.budget-group { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.group-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.group-head h3 { margin-right: auto; }
.group-total { color: var(--muted); font-size: .9rem; }
.eq-preview { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; font-size: .9rem; color: var(--muted); }
dl.eq { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px 12px; margin: 6px 0 0; }
dl.eq dt { font-size: .78rem; } dl.eq dd { margin: 0; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.split-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px 16px; display: grid; gap: 8px; }

/* ---------- Savings ---------- */
.ef { border-color: #e7d3a8; }
.ef-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; align-items: end; }
@media (max-width: 760px) { .ef-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ef-n { font-weight: 700; font-size: 1.1rem; color: var(--heading); }
.goal-detail { display: grid; gap: 16px; }
ul.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
ul.plain li { display: flex; justify-content: space-between; gap: 10px; align-items: center; }

/* ---------- Overview ---------- */
.start { background: var(--cream); border-color: #ece0c4; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.steps li { display: flex; gap: 10px; align-items: center; }
.tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; font-size: .72rem; flex: none; background: var(--surface); }
.steps li.done .tick { background: var(--good); border-color: var(--good); color: #fff; }
.steps li.done { color: var(--muted); text-decoration: line-through; }
.table-toggle summary { cursor: pointer; font-size: .9rem; font-weight: 700; color: var(--accent); }
.table-toggle[open] summary { margin-bottom: 10px; }
.mini-card { gap: 12px; }
.mini-card dl.rows > div { padding: 8px 0; }

/* ---------- Charts ---------- */
.chart-wrap { position: relative; width: 100%; overflow-x: auto; }
svg.chart { width: 100%; min-width: 480px; height: auto; display: block; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .grid.zero { stroke: var(--line-strong); stroke-width: 1.5; }
svg.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
svg.chart .axis.sel { fill: var(--heading); font-weight: 700; }
svg.chart .axis.faint { fill: var(--line-strong); }
svg.chart .val { fill: var(--heading); font-size: 11px; font-weight: 700; font-family: var(--font); }
svg.chart .bar { fill: var(--bar); opacity: .55; }
svg.chart .bar.sel { opacity: 1; }
svg.chart .hit { fill: transparent; cursor: pointer; }
svg.chart .hit:hover, svg.chart .hit:focus { fill: rgba(61, 122, 102, .08); outline: none; }
svg.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
svg.chart .area { fill: rgba(61, 122, 102, .12); stroke: none; }
svg.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
svg.chart .dot.end { fill: var(--accent); }
.tip { position: absolute; background: var(--forest); color: #fff; font-size: .82rem; padding: 8px 11px; border-radius: 9px; pointer-events: none; max-width: 270px; box-shadow: 0 8px 22px rgba(0,0,0,.18); z-index: 5; }

/* ---------- Net worth ---------- */
.nw-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
.nw-group h3 { display: flex; justify-content: space-between; gap: 8px; font-size: .95rem; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.nw-group ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; font-size: .9rem; }
.nw-group li { display: flex; justify-content: space-between; gap: 8px; }
.nw-edit { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; display: grid; gap: 12px; }
.nw-edit legend { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.nw-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; }
@media (max-width: 560px) { .nw-row { grid-template-columns: minmax(0, 1fr); } }
.nw-edit > .btn { justify-self: start; }

/* ---------- Settings ---------- */
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
@media (max-width: 1000px) { .settings { grid-template-columns: minmax(0, 1fr); } }
.freq-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 460px) { .freq-grid { grid-template-columns: minmax(0, 1fr); } }
.freq-tile { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.freq-tile:has(input:checked) { border-color: #b9cfc4; background: #fbfcfa; }
.freq-tile input { width: 22px; height: 22px; flex: none; margin: 0; }
.freq-tile strong { display: block; color: var(--heading); }
.row-sub { display: block; font-size: .84rem; color: var(--muted); font-weight: 500; }
.alloc .manual-fields { display: none; }
.alloc:has(input[value="manual"]:checked) .manual-fields { display: grid; }
.alloc:has(input[value="manual"]:checked) .income-note { display: none; }
.split-effect dd { font-weight: 600; }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list.scroll { max-height: 440px; overflow-y: auto; padding-right: 4px; }
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: 0; }
.list-row.archived .row-name { color: var(--muted); }
.row-name { font-weight: 700; color: var(--heading); }
.row-actions { display: flex; align-items: center; gap: 4px; }
.row-actions .icon-btn .ico { width: 18px; height: 18px; }
.cat-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.danger-zone { border-top: 1px solid var(--line); padding-top: 18px; }
.onboard { grid-column: 1 / -1; display: grid; place-items: start center; padding-block: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: none; background: var(--bg); }
.onboard-card { max-width: 640px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 34px; display: grid; gap: 18px; }
.onboard-card h1 { font-size: 2.1rem; }
.onboard-card h1:focus { outline: none; }
.onboard-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.loading { grid-column: 1 / -1; padding: 60px 20px; display: grid; gap: 12px; justify-items: center; text-align: center; color: var(--muted); }

/* ---------- Credit cards ---------- */
.cc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
@media (max-width: 400px) { .cc-grid { grid-template-columns: minmax(0, 1fr); } }
.cc-list { display: grid; }
.cc-row { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 6px 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cc-row:last-child { border-bottom: 0; }
.cc-fig { display: grid; gap: 2px; justify-items: end; text-align: right; }
.cc-fig .label { font-size: .68rem; }
.cc-bar { grid-column: 1 / -1; }
@media (max-width: 560px) { .cc-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cc-name { grid-column: 1 / -1; } .cc-fig { justify-items: start; text-align: left; } }
.biz-line { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 12px 14px; background: var(--surface-2); border-radius: var(--radius-sm); }
.stat-foot .badge, .kpi-extra .badge, .cc-fig .badge, dd .badge { white-space: normal; }

/* ---------- Dialog ---------- */
dialog { border: 0; border-radius: 22px; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px rgba(15, 35, 28, .3); }
dialog.wide { width: min(780px, calc(100vw - 24px)); }
dialog.narrow { width: min(470px, calc(100vw - 24px)); }
dialog::backdrop { background: rgba(31, 58, 51, .45); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
dialog form, dialog > div { display: flex; flex-direction: column; max-height: calc(100dvh - 24px); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 30px 34px 6px; }
.dlg-head h2 { font-size: 1.6rem; }
.dlg-body { padding: 18px 34px 8px; overflow-y: auto; display: grid; gap: 14px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 34px 30px; }
.dlg-foot.wrap { flex-wrap: wrap; }
@media (max-width: 560px) { .dlg-head { padding: 22px 20px 4px; } .dlg-body { padding: 14px 20px 6px; } .dlg-foot { padding: 14px 20px 22px; } }

/* ---------- Toasts ---------- */
.toasts { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; z-index: 60; }
.toast { background: var(--forest); color: #fff; padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: .92rem; box-shadow: 0 8px 22px rgba(0,0,0,.2); max-width: min(420px, calc(100vw - 36px)); }
.toast.bad { background: var(--bad); }
.list-row > div:first-child { min-width: 0; overflow-wrap: anywhere; } .row-actions { flex: none; }
/* Keep the sidebar colour running the full height of long pages. */
#app { background: linear-gradient(to right, var(--forest) var(--side-w), var(--bg) var(--side-w)); }

/* ---------- Screenshot-matching details ---------- */
.month-picker { gap: 16px; }
.month-input { font: inherit; font-weight: 600; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 14px; min-height: 48px; background: var(--surface); min-width: 190px; }
.month-input::-webkit-calendar-picker-indicator { cursor: pointer; opacity: .85; }
.save-status.sr-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.chart .stub { fill: var(--bar); opacity: .8; }
.name-pill { font-size: .85rem; padding: 4px 12px; background: var(--tint); color: var(--heading); }
.name-pill.gold { background: var(--gold-soft); color: var(--gold-deep); }
.mini-card .card-head { align-items: center; }
.label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.label-row label { font-weight: 700; font-size: .9rem; color: var(--heading); }
.affix.suffix input { padding-left: 14px; padding-right: 34px; }
.affix.suffix > span { left: auto; right: 14px; }
.cat-bar { justify-content: flex-end; }
.count { line-height: 1.3; }
@media (max-width: 600px) { .month-input { min-width: 0; padding: 8px 10px; min-height: 42px; } }
/* Page intro: actions stay on the right of the heading, as in the reference. */
.hero { flex-wrap: nowrap; }
.hero-text { flex: 1 1 auto; }
.hero .page-actions { flex: none; justify-content: flex-end; }
@media (max-width: 720px) { .hero { flex-wrap: wrap; } }
.goals-table th, .goals-table td { padding: 14px 12px; }
.goals-table th:first-child, .goals-table td:first-child { padding-left: 20px; min-width: 150px; }
.goals-table thead th { white-space: normal; }
.goals-table .progress { max-width: 120px; }

/* ---------- Monthly check-in ---------- */
.ci-list { list-style: none; margin: 0; padding: 0; display: grid; }
.ci-name { display: grid; gap: 2px; min-width: 0; }
.ci-name label { font-weight: 700; color: var(--heading); }
.ci-input input { min-height: 44px; }
.one-offs > summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; list-style-position: inside; }
.h2-like { font-size: 1.2rem; font-weight: 700; color: var(--heading); letter-spacing: -0.01em; }
details.card:not([open]) { gap: 0; }
.form-end { display: flex; justify-content: flex-end; }

/* ---------- Plan rows ---------- */
.plan-summary { color: var(--muted); }
.plan-summary strong { color: var(--heading); }
.plan-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px 170px 120px auto; gap: 8px 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.plan-row:last-child { border-bottom: 0; }
.plan-row.flagged { background: var(--warn-soft); margin: 0 -12px; padding: 12px; border-radius: 10px; }
.pr-amt, .pr-month { text-align: right; display: grid; justify-items: end; }
.pr-month .row-sub { font-size: .76rem; }
@media (max-width: 860px) { .plan-row { grid-template-columns: minmax(0, 1fr) auto; } .pr-name { grid-column: 1 / -1; } .pr-amt { display: none; } .pr-month { justify-items: start; text-align: left; } .row-actions { grid-column: 1 / -1; justify-content: flex-start; } }

/* ---------- Kids chips, business switch ---------- */
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 6px 6px 14px; border-radius: 999px; background: var(--tint); color: var(--heading); font-weight: 700; }
.chip-x { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; line-height: 1; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; }
.chip-x:hover { background: rgba(0,0,0,.06); color: var(--heading); }
.chip-add { display: flex; gap: 6px; align-items: center; }
.chip-add input { font: inherit; border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 14px; min-height: 38px; width: 190px; }
.biz-switch { align-self: start; justify-self: start; flex-wrap: wrap; }

/* ---------- Overview cards ---------- */
.cc-line { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cc-line:last-child { border-bottom: 0; }
.cc-top, .cc-bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cc-line .progress { max-width: none; margin: 0; }
.goal-mini .progress { max-width: none; margin: 0 0 4px; }
.joint-note { background: var(--tint); border-radius: var(--radius-sm); padding: 12px 14px; color: var(--heading); }
.kid-goals .card-head { align-items: center; }
.kid-total { display: grid; justify-items: end; margin-left: auto; }
.kid-total .num { font-size: 1.15rem; }
@media (max-width: 600px) { .kid-total { justify-items: start; margin-left: 0; } }

/* =====================================================================
   Material UI theme layer — MUI components (Paper, Table, TextField, Button,
   Chip, Tabs, ToggleButtonGroup, Dialog, LinearProgress) themed with the
   household brand: primary = forest green, secondary = gold.
   ===================================================================== */
:root {
  --font: "Roboto", "Helvetica", "Arial", sans-serif;
  --mui-text: rgba(0, 0, 0, .87); --mui-text-2: rgba(0, 0, 0, .6); --mui-text-3: rgba(0, 0, 0, .38);
  --mui-divider: rgba(0, 0, 0, .12); --mui-border: rgba(0, 0, 0, .23); --mui-cell-line: rgba(224, 224, 224, 1);
  --mui-hover: rgba(0, 0, 0, .04); --mui-primary-08: rgba(47, 102, 86, .08); --mui-primary-12: rgba(47, 102, 86, .12); --mui-primary-50: rgba(47, 102, 86, .5);
  --e1: 0 2px 1px -1px rgba(0,0,0,.2), 0 1px 1px 0 rgba(0,0,0,.14), 0 1px 3px 0 rgba(0,0,0,.12);
  --e2: 0 3px 1px -2px rgba(0,0,0,.2), 0 2px 2px 0 rgba(0,0,0,.14), 0 1px 5px 0 rgba(0,0,0,.12);
  --e8: 0 5px 5px -3px rgba(0,0,0,.2), 0 8px 10px 1px rgba(0,0,0,.14), 0 3px 14px 2px rgba(0,0,0,.12);

}

/* Paper / Card */

.card { padding: 16px; gap: 16px; }

/* Table — MUI <Table> */

.mui-table thead th, table thead th { font-size: .875rem; font-weight: 500; text-transform: none; letter-spacing: .01071em; color: var(--mui-text); line-height: 1.5rem; background: var(--surface); white-space: nowrap; padding-top: 14px; padding-bottom: 14px; }
.card.flush .mui-table thead th { background: var(--surface); }

col.c-amt { width: 130px; } col.c-freq { width: 180px; } col.c-act { width: 130px; } col.c-input { width: 200px; } col.c-status { width: 210px; } col.c-goal { width: 30%; } col.c-saved { width: 170px; }

.table-wrap.scroll { max-height: 440px; overflow-y: auto; }

}

/* Button — MUI <Button> (contained / outlined / text) */

.icon-btn { border-radius: 50%; }

/* TextField — MUI outlined, label resting on the outline */
.form-grid { row-gap: 24px; column-gap: 16px; }
.field { position: relative; gap: 4px; }
.field > label, .field > .label-row { position: absolute; top: -9px; left: 10px; z-index: 1; padding: 0 5px; background: var(--surface); font-size: .75rem; font-weight: 400; line-height: 1.2; letter-spacing: .00938em; color: var(--mui-text-2); text-transform: none; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field > .label-row { right: 10px; display: flex; justify-content: space-between; gap: 8px; overflow: visible; padding: 0; background: transparent; }

  font-family: var(--font); font-size: 1rem; min-height: 56px; border-radius: 4px; border: 1px solid var(--mui-border); padding: 16.5px 14px; color: var(--mui-text); background: var(--surface); }
.field select { padding-right: 32px; }

.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.field [aria-invalid="true"], .ci-input [aria-invalid="true"] { border-color: var(--bad) !important; box-shadow: inset 0 0 0 1px var(--bad); }

.hint, .field .error { margin: 0 14px; }

.ci-input input, .freq-select, .chip-add input { font-family: var(--font); font-size: .875rem; border-radius: 4px; border: 1px solid var(--mui-border); min-height: 40px; padding: 8px 12px; color: var(--mui-text); background: var(--surface); }
.ci-input .affix input { padding-left: 26px; }
.ci-input input:focus, .freq-select:focus, .chip-add input:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.freq-select { max-width: 170px; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }

/* Chip — MUI <Chip> */
.badge { height: 24px; border-radius: 16px; font-size: .8125rem; font-weight: 400; letter-spacing: .01071em; padding: 0 10px; }
.badge.good { background: rgb(237, 247, 237); color: rgb(30, 70, 32); }
.badge.bad { background: rgb(253, 237, 237); color: rgb(95, 33, 32); }
.badge.warn { background: rgb(255, 244, 229); color: rgb(102, 60, 0); }
.pill { height: 24px; line-height: 24px; padding: 0 10px; border-radius: 16px; font-size: .8125rem; font-weight: 400; letter-spacing: .01071em; }
.chip { height: 32px; border-radius: 16px; padding: 0 4px 0 12px; background: rgba(0, 0, 0, .08); color: var(--mui-text); font-size: .8125rem; font-weight: 400; }
.chip-x { width: 22px; height: 22px; border-radius: 50%; background: rgba(0, 0, 0, .26); color: #fff; font-size: .9rem; display: grid; place-items: center; margin-left: 4px; }
.chip-x:hover { background: rgba(0, 0, 0, .4); color: #fff; }
.chip-add input { border-radius: 16px; height: 32px; min-height: 32px; padding: 4px 12px; width: 180px; }

/* Tabs — MUI <Tabs> */
.tabs { border-bottom: 1px solid var(--mui-divider); gap: 0; }
.tab { font-family: var(--font); font-size: .875rem; font-weight: 500; letter-spacing: .02857em; text-transform: uppercase; min-height: 48px; padding: 12px 16px; color: var(--mui-text-2); border-bottom: 2px solid transparent; }
.tab:hover { background: var(--mui-hover); }

/* ToggleButtonGroup — period switch, allocation, business picker */

.seg-btn, .segmented label span, .seg-item { font-family: var(--font); font-size: .8125rem; font-weight: 500; letter-spacing: .02857em; text-transform: uppercase; color: var(--mui-text-2); padding: 7px 14px; border: 1px solid var(--mui-divider); border-radius: 0; margin-left: -1px; background: transparent; box-shadow: none !important; }

.seg-btn:hover, .seg-item:hover, .segmented label span:hover { background: var(--mui-hover); }

/* LinearProgress */

/* Dialog — MUI <Dialog> */

/* Lists and misc */

.savings-ci col.c-input { width: 170px; }

.mui-table tr.prio-last > th, .mui-table tr.prio-last > td { border-bottom: 1px solid var(--gold, #d4a94a); }

.settings > .span-all { grid-column: 1 / -1; }
.accounts-table th[scope="row"] { min-width: 180px; }

/* Top priority: a clear pill by the name and a soft gold tint on the row */
.prio-pill { display: inline-flex; align-items: center; gap: 3px; font-size: .72rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
  padding: 1px 8px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-deep); border: 1px solid var(--gold); vertical-align: 1px; margin-right: 6px; white-space: nowrap; }
.mui-table tr.prio-row > th, .mui-table tr.prio-row > td { background: #fdf8ee; }

/* Savings card: Fixed / Variable sub-headings */
.budget-table tr.sub-head > th { background: var(--mui-primary-08, #eef3f1); font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mui-text-2, #555); padding-top: 8px; padding-bottom: 8px; }
.budget-table tr.sub-head .sub-note { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
.due-now { color: var(--gold-deep); font-weight: 600; }
.btn.due-set { padding-left: 0; padding-right: 0; }
/* Version label */
.app-version { font-size: .72rem; opacity: .6; margin-top: 4px; }
.ahead-grid > summary { cursor: pointer; list-style: revert; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.ahead-grid .h2-like { font-size: 1.15rem; font-weight: 500; }
.card-head > div.segmented { display: inline-flex; flex: 0 0 auto; flex-direction: row; flex-wrap: nowrap; }
.card-head > .segmented .seg-item { white-space: nowrap; }
.ahead-grid > summary.pad { padding: 16px; }
.card-head > div:has(#ah-come) { flex: 1 1 320px; min-width: 0; }
/* Savings: Coming up timeline */
.timeline { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding-top: 0; }
.tl-month { border: 1px solid var(--mui-divider, #e3e6e3); border-radius: 8px; padding: 10px 12px; min-height: 84px; background: var(--surface, #fff); }
.tl-month.heavy { border-color: #e7c27a; background: #fffaf0; }
.tl-month.quiet { background: transparent; }
.tl-head { font-weight: 600; font-size: .85rem; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
.tl-month ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tl-item { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; font-size: .85rem; line-height: 1.3; }
.tl-item .tl-name { font: inherit; text-align: left; padding: 0; border: 0; background: none; }
.tl-item .tl-kind { grid-column: 1 / -1; font-size: .75rem; color: var(--mui-text-2, #666); }
.tl-item.bill .tl-name::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #b0863c; margin-right: 6px; vertical-align: middle; }
.tl-item.goal .tl-name { color: var(--accent); cursor: pointer; }
.tl-item.past .tl-kind { color: #b3261e; }
.tl-none { font-size: .8rem; margin: 0; }
.tl-item .prio-pill { font-size: .6rem; padding: 0 5px; margin-right: 4px; }
.stat-unit { font-size: .9rem; font-weight: 400; }
.goals-table tr.sub-head > th { padding-top: 10px; padding-bottom: 10px; }
@media (min-width: 900px) { .timeline.tl-n3 { grid-template-columns: repeat(3, 1fr); } .timeline.tl-n6, .timeline.tl-n12 { grid-template-columns: repeat(6, 1fr); } }
.timeline .tl-month { padding: 10px; }
.card-head > div.segmented { max-width: 100%; overflow-x: auto; }
@media (max-width: 700px) { .card-head > div.segmented { flex-wrap: wrap; } .goals-table td.r { text-align: left; } }
@media (max-width: 700px) { .mui-table tr.prio-last > th, .mui-table tr.prio-last > td { border-bottom: 0; } .mui-table tr.prio-last { border-bottom: 1px solid var(--gold, #d4a94a); } }
.ahead-card .card-head { align-items: center; }
.ahead-card h2 { margin: 0; flex: 1 1 auto; }
.collapse-btn { font: inherit; color: inherit; background: none; border: 0; padding: 4px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.collapse-btn .chev { display: inline-block; transition: transform .15s; font-size: .9em; color: var(--mui-text-2, #666); }
.collapse-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.collapse-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.ah-note { padding-top: 0; margin-top: -6px; }
.ahead-card .inline-select select { min-height: 0; height: 36px; padding: 4px 32px 4px 10px; font-size: .9rem; }
.ah-status { display: inline-block; font-size: .78rem; padding: 2px 8px; border-radius: 10px; background: var(--mui-primary-08, #eef3f1); color: var(--mui-text-2, #555); white-space: nowrap; }
.ah-status.good { background: #e6f3ea; color: #1e6b3a; }
.ah-status.warn { background: #fdf0dc; color: #8a5300; }
.ah-status.prio { background: #fbf1d9; color: #7a5a12; }
.ah-status.info { background: #e8eef8; color: #2a4a7a; }
.dlg-foot .dlg-del { margin-right: auto; }
/* Budget: one table with group headings */
.one-table > tbody + tbody { border-top: 0; }
.one-table tr.bgh > th, .one-table tr.bgh > td { background: var(--mui-primary-08, #eef3f1); padding-top: 12px; padding-bottom: 12px; border-top: 8px solid var(--bg, #f4f4f1); }
.one-table tbody:first-of-type tr.bgh > * { border-top: 0; }
.one-table tr.bgh .g-title { font-weight: 600; font-size: .95rem; color: var(--heading, #1f3a33); }
.one-table tr.bgh .g-note { display: block; font-size: .78rem; color: var(--mui-text-2, #666); font-weight: 400; margin-top: 2px; }
.one-table tr.bgh > td { font-weight: 600; }
.one-table tr.bgh .g-actual { padding-left: 16px; }
.one-table .add-in-group { margin-left: 10px; padding: 2px 8px; font-size: .78rem; vertical-align: middle; }
.one-table tr.readonly th .cell-primary { color: var(--mui-text-2, #555); }
.link-amt { font: inherit; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; font-variant-numeric: tabular-nums; border-bottom: 1px dashed var(--mui-divider, #c9cec9); }
.link-amt:hover { color: var(--accent); border-bottom-color: var(--accent); }
.link-amt.unset { color: var(--accent); font-size: .85rem; border-bottom: 0; text-decoration: underline; text-underline-offset: 3px; }
.tiny-link { font-size: .76rem; padding: 2px 0; margin-top: 4px; text-transform: none; letter-spacing: 0; color: var(--mui-text-2, #666); }
.tiny-link:hover { color: var(--accent); }
.out-row { margin-top: 8px; display: grid; gap: 2px; }
.joint-note { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 12px 16px; background: var(--surface, #fff); border: 1px solid var(--mui-divider, #e3e6e3); border-radius: 8px; font-size: .9rem; }
.joint-note .ico, .joint-note svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 2px; }
.one-table .tiny-link { opacity: 0; transition: opacity .12s; }
.one-table tr:hover .tiny-link, .one-table tr:focus-within .tiny-link, .one-table .tiny-link:focus-visible { opacity: 1; }
@media (hover: none) { .one-table .tiny-link { opacity: 1; } }
.one-table td.actions { white-space: nowrap; }
.one-table .due-set { display: block; margin-left: auto; margin-top: 2px; font-size: .78rem; }
.link-amt.owing { display: block; font-size: .78rem; color: var(--mui-text-2, #666); margin-top: 2px; }
.one-table tr.empty-groups > td { padding: 14px 16px; background: var(--mui-primary-08, #eef3f1); }
.one-table tr.empty-groups .row-sub { margin-right: 8px; }
.chip-add { font: inherit; font-size: .82rem; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; margin: 2px 4px 2px 0; border: 1px dashed var(--mui-divider, #c9cec9); border-radius: 14px; background: var(--surface, #fff); color: var(--accent); cursor: pointer; }
.chip-add:hover { border-style: solid; }
.chip-add .ico { width: 14px; height: 14px; }
@media (max-width: 700px) {
  .one-table tr.bgh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; background: var(--mui-primary-08, #eef3f1); padding: 12px 16px; margin-top: 8px; }
  .one-table tr.bgh > th, .one-table tr.bgh > td { background: none; border: 0; padding: 0; }
  .one-table tr.bgh > th { flex: 1 1 100%; }
  .one-table tr.bgh > td[data-label]::before { display: inline; content: attr(data-label) " "; font-weight: 400; margin: 0 4px 0 0; }
  .one-table tr.bgh > td:last-child { display: none; }
  .one-table tr.bgh > td { font-size: .85rem; }
}
/* Sign-in screens */
.auth-card { max-width: 440px; }
.auth-form { grid-template-columns: 1fr; margin-top: 8px; }
.auth-form .auth-submit { width: 100%; justify-content: center; }
.auth-foot { margin-top: 18px; border-top: 1px solid var(--mui-divider, #e3e6e3); padding-top: 14px; }
.auth input[readonly] { background: var(--mui-primary-08, #eef3f1); color: var(--mui-text-2, #555); }
/* Sidebar: who's signed in */
.side-user { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); }
.side-user .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #d4a94a; color: #1f3a33; font-weight: 700; flex: 0 0 auto; }
.side-user p { margin: 0; line-height: 1.25; }
.side-user .su-name { font-weight: 600; font-size: .9rem; }
.side-user .su-role { font-size: .75rem; opacity: .75; }
.side-user .su-out { margin-left: auto; color: inherit; opacity: .85; text-transform: none; letter-spacing: 0; }
/* People & access */
.people-table .role-select { padding: 4px 8px; border: 1px solid var(--mui-divider, #c9cec9); border-radius: 4px; font: inherit; font-size: .88rem; background: var(--surface, #fff); }
.people-table tr.pending th .cell-primary { color: var(--mui-text-2, #555); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
/* Spending: open a category to see its lines */
.cat-toggle { font: inherit; font-weight: 500; color: var(--heading, #1f3a33); background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.cat-toggle .chev { display: inline-block; font-size: .8em; color: var(--mui-text-2, #666); transition: transform .15s; }
.cat-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.cat-toggle:hover { color: var(--accent); }
.spend-table tr.cat-item > th, .spend-table tr.cat-item > td { background: #fafbf9; padding-top: 8px; padding-bottom: 8px; font-size: .9rem; }
.spend-table tr.cat-item > th { padding-left: 34px; }
.spend-table tr.cat-item.over > th .cell-primary { color: #8a3b12; font-weight: 600; }
.spend-table tr.cat-item.over > th { box-shadow: inset 3px 0 0 #d97a3a; }
@media (max-width: 520px) { .topbar .topbar-title, .topbar .eyebrow { display: none; } }
.demo-banner { background: #fbf1d9; color: #5a4310; font-size: .85rem; padding: 8px 16px; text-align: center; border-bottom: 1px solid #ecd9a6; }
</style>
